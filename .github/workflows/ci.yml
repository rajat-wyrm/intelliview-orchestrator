name: CI

on:
  push:
    branches: [main, Stabilized-version,issue-22-dataset-validation]

  pull_request:
    branches: [main, Stabilized-version,issue-22-dataset-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # Python tests
  # --------------------------------------------------

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_interview_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_SSLMODE: disable
      API_TOKEN: ci-test-token
      JSON_LOGGING: "0"
      ENABLE_PROMETHEUS: "true"
      CORS_ALLOW_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "10000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
              pip install "packaging<26"
          pip install "ruff==0.9.10" "black==25.1.0" "isort==6.0.1"
      - name: Black format check
        run: python -m black --check .
      - name: isort import check
        run: python -m isort --check-only --profile black .
      - name: Ruff lint
        run: ruff check orchestrator workers monitoring database tests scripts routers retrieval

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_e2e_smoke.py \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-coverage-report
          path: htmlcov/

  # --------------------------------------------------
  # End-to-end tests
  # --------------------------------------------------

  e2e:
    name: End-to-End Smoke Test
    needs: test
    runs-on: ubuntu-latest

    env:
      API_TOKEN: ci-test-token
      API_BASE_URL: http://localhost:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      XDG_CACHE_HOME: /tmp/.cache
      HOME: /tmp
      TMPDIR: /tmp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest

      - name: Validate API import path
        run: |
          docker compose -f docker-compose.yml run --rm fastapi \
            python -c "import orchestrator.main; print('ok')"

      - name: Bring up full stack
        run: |
          docker compose -f docker-compose.yml up -d --build \
            redis postgres fastapi worker

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_BASE_URL/health"; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Run end-to-end smoke tests
        run: pytest tests/test_e2e_smoke.py -v -m e2e

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=300

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # --------------------------------------------------
  # Frontend lint + build
  # --------------------------------------------------

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run ESLint
        run: npx eslint .

      - name: Build frontend
        run: npm run build

  # --------------------------------------------------
  # Check whether Docker Hub secrets are configured
  # --------------------------------------------------

  check-secrets:
    name: Check Docker Secrets
    runs-on: ubuntu-latest
    outputs:
      has-docker-creds: ${{ steps.check.outputs.has-docker-creds }}

    steps:
      - name: Check for Docker Hub credentials
        id: check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "has-docker-creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-docker-creds=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------
  # Docker build and push
  # Runs only after merge/push to main
  # --------------------------------------------------

  docker-build:
    name: Build and Push Docker Images
    needs:
      - test
      - e2e
      - frontend
      - check-secrets
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Stabilized-version') &&
      needs.check-secrets.outputs.has-docker-creds == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intelliview-fastapi:latest
            ${{ secrets.DOCKER_USERNAME }}/intelliview-fastapi:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/intelliview-worker:latest
            ${{ secrets.DOCKER_USERNAME }}/intelliview-worker:${{ github.sha }}
