name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_interview_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_SSLMODE: disable
      API_TOKEN: ci-test-token
      JSON_LOGGING: "0"
      ENABLE_PROMETHEUS: "true"
      CORS_ALLOW_ORIGINS: "*"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort
      - name: Black format check
        run: black --check .
      - name: isort import check
        run: isort --check-only --profile black .
      - name: Ruff lint
        run: ruff check orchestrator workers monitoring database tests scripts
      - name: Ruff format check
        run: ruff format --check orchestrator workers monitoring database tests scripts
      - name: Pytest
        run: pytest tests/ --ignore=tests/test_e2e_smoke.py -v

  e2e:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      API_TOKEN: test-token
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest

      - name: Bring up full stack (redis, postgres, api, worker)
        run: docker compose up -d --build redis postgres fastapi worker

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_BASE_URL/health"; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose logs
          exit 1

      - name: Run end-to-end smoke tests
        run: pytest tests/test_e2e_smoke.py -v -m e2e

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose --progress=plain build fastapi worker

      - name: Verify built images
        run: docker compose images fastapi worker
# Trigger CI check
      - name: Test
        run: npm run test