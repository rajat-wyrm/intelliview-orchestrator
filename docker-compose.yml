services:
  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  postgres:
    image: postgres:15
    container_name: ai-interview-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-fastapi
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      API_TOKEN: "${API_TOKEN}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      ENABLE_PROMETHEUS: "${ENABLE_PROMETHEUS:-true}"
      AUDIT_LOG_FILE: "${AUDIT_LOG_FILE:-}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ai-interview-network
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-worker
    ports:
      - "9101:9101"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      API_URL: "http://fastapi:8000"
      API_TOKEN: "${API_TOKEN}"
      WORKER_CONCURRENCY: "4"
      WORKER_ID: "${WORKER_ID:-worker-1}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - ai-interview-network
    command: python -m workers.worker_entrypoint
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A workers.celery_app.celery_app inspect ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "4.0"

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-flower
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      API_TOKEN: "${API_TOKEN}"
      PYTHONPATH: "/app"
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app
    networks:
      - ai-interview-network
    command: celery -A workers.celery_app.celery_app flower --url_prefix=flower
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5555/flower"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  celery-exporter:
    image: danihodovic/celery-exporter
    container_name: ai-interview-celery-exporter
    command:
      - --broker-url
      - redis://redis:6379/0
      - --host
      - 0.0.0.0
      - --port
      - "9540"
    ports:
      - "9540:9540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-interview-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-interview-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-interview-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: ai-interview-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ai-interview-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - ai-interview-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-interview-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - ai-interview-network
    restart: unless-stopped          

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-interview-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ai-interview-network:
    driver: bridge
